name: Deploy Web Version

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 0'  # Weekly on Sunday

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create web-build directory
        run: mkdir -p web-build

      - name: Download latest release assets using GitHub API
        run: |
          # Get the latest release info
          curl -s https://api.github.com/repos/JHDev2006/Super-Mario-Bros.-Remastered-Public/releases/latest > release.json
          
          # Extract download URLs for all assets
          cat release.json | jq -r '.assets[] | "\(.name) \(.browser_download_url)"' > urls.txt
          
          cat urls.txt
          
          cd web-build
          
          # Download each file
          while read line; do
            if [ ! -z "$line" ]; then
              filename=$(echo "$line" | awk '{print $1}')
              url=$(echo "$line" | awk '{print $2}')
              echo "Downloading: $filename from $url"
              wget -q "$url" -O "$filename" && echo "✓ Downloaded $filename" || echo "✗ Failed to download $filename"
            fi
          done < ../urls.txt
          
          cd ..
          echo ""
          echo "Files in web-build:"
          ls -lh web-build/

      - name: Commit and push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add web-build/
          if ! git diff --quiet --cached; then
            git commit -m "Update: Deploy latest web version"
            git push
          else
            echo "No changes to commit"
          fi
