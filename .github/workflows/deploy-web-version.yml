name: Deploy Web Version

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 0'

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download and setup web version
        run: |
          mkdir -p web-build
          cd web-build
          
          # Base URL for the latest release
          BASE_URL="https://github.com/JHDev2006/Super-Mario-Bros.-Remastered-Public/releases/download/1.1-rc2"
          
          echo "Downloading from: $BASE_URL"
          
          # Download all files
          files=(
            "SMB1R.html"
            "SMB1R.js"
            "SMB1R.audio.worklet.js"
            "SMB1R.audio.position.worklet.js"
            "merge.js"
            "SMB1R.wasm.part1"
            "SMB1R.wasm.part2"
            "SMB1R.pck.part1"
            "SMB1R.pck.part2"
            "SMB1R.pck.part3"
            "SMB1R.png"
            "SMB1R.icon.png"
            "SMB1R.apple-touch-icon.png"
            "Super Mario Bros. (Europe).nes"
          )
          
          for file in "${files[@]}"; do
            echo "Downloading $file..."
            wget -q "$BASE_URL/$file" -O "$file" 2>/dev/null && echo "✓ $file" || echo "✗ Failed: $file"
          done
          
          cd ..
          echo ""
          echo "Final file list:"
          ls -lh web-build/
          echo ""
          echo "Total files: $(ls web-build/ | wc -l)"

      - name: Commit and push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add web-build/
          if ! git diff --quiet --cached; then
            git commit -m "chore: Update web build files"
            git push
          else
            echo "No changes to commit"
          fi
